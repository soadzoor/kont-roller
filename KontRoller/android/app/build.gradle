apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = true

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

// Local credentials are ignored by Git; environment/Gradle properties also work.
def localSigning = new Properties()
def signingFile = rootProject.file("signing.properties")
if (signingFile.exists()) signingFile.withReader('UTF-8') { localSigning.load(it) }
def signingValue = { name -> localSigning.getProperty(name) ?: providers.gradleProperty(name).orElse(providers.environmentVariable(name)).orNull }
def uploadStoreFile = signingValue("MYAPP_UPLOAD_STORE_FILE")
def uploadStorePassword = signingValue("MYAPP_UPLOAD_STORE_PASSWORD")
def uploadKeyPassword = signingValue("MYAPP_UPLOAD_KEY_PASSWORD") ?: uploadStorePassword
def uploadKeyAlias = signingValue("MYAPP_UPLOAD_KEY_ALIAS")
if (uploadStoreFile && uploadStorePassword && !uploadKeyAlias) {
    def uploadStore = java.security.KeyStore.getInstance(file(uploadStoreFile), uploadStorePassword.toCharArray())
    def aliases = Collections.list(uploadStore.aliases()).findAll { uploadStore.isKeyEntry(it) }
    if (aliases.size() != 1) throw new GradleException("Set MYAPP_UPLOAD_KEY_ALIAS in android/signing.properties; the keystore has multiple keys.")
    uploadKeyAlias = aliases.first()
}
def canSignRelease = uploadStoreFile && uploadStorePassword && uploadKeyAlias && uploadKeyPassword

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.soadzoor.kontroller"
    defaultConfig {
        applicationId "com.soadzoor.kontroller"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode = (project.findProperty("KONTROLLER_VERSION_CODE") ?: "109").toString().toInteger()
        versionName = (project.findProperty("KONTROLLER_VERSION_NAME") ?: "1.09").toString()
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (canSignRelease) {
            release {
                storeFile file(uploadStoreFile)
                storePassword uploadStorePassword
                keyAlias uploadKeyAlias
                keyPassword uploadKeyPassword
            }
        }
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                maxHeapSize = '2g'
                def testHome = rootProject.file('.tmp/test-home')
                testHome.mkdirs()
                systemProperty 'user.home', testHome.absolutePath
                systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
                systemProperty 'maven.repo.local', rootProject.file('.m2/repository').absolutePath
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            // Use the existing upload key when configured; otherwise leave the artifact unsigned.
            if (canSignRelease) {
                signingConfig signingConfigs.release
            }
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.17"
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

// Never accidentally distribute a debug-signed or unsigned production release.
gradle.taskGraph.whenReady { graph ->
    if ((graph.hasTask(":app:bundleRelease") || graph.hasTask(":app:assembleRelease")) && !canSignRelease && project.findProperty("allowUnsignedRelease") != "true") {
        throw new GradleException("Configure the existing upload key in android/signing.properties before building a release. For local binary inspection only, use -PallowUnsignedRelease=true.")
    }
}

// RN 0.88.1 still calls deprecated window APIs. Use the app's supported system-bar implementation.
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.instrumentation.transformClassesWith(com.soadzoor.build.ReactNativeWindowVisitorFactory, com.android.build.api.instrumentation.InstrumentationScope.ALL) {}
        variant.instrumentation.setAsmFramesComputationMode(com.android.build.api.instrumentation.FramesComputationMode.COMPUTE_FRAMES_FOR_INSTRUMENTED_METHODS)
    }
}
